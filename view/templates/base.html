<!DOCTYPE html>
<html lang="en">
<head>
    <!--
      base.html
      =========
      Responsibility:
      - Base layout template containing shared HTML head, navigation bar, footer, Bootstrap 5 CSS, and custom styles.
      
      TODO:
      - Add meta tags, title block, dark/light navbar, footer, script block.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fake News Detection{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN placeholder -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <!-- TODO: Navbar implementation -->
    </header>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <!-- TODO: Footer implementation -->
    </footer>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
