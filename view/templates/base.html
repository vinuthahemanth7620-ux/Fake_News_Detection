<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered Fake News Detection application built with Python, Flask, and Machine Learning. Verifies news article authenticity with high confidence precision.">
    <title>{% block title %}Fake News Detector - AI Article Authenticity Verifier{% endblock %}</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom Application CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Header Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm py-3">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('presenter.index') }}">
                    <i class="bi bi-shield-check text-primary fs-3"></i>
                    <span class="fs-4 fw-bold">FakeNews<span class="text-primary">Detector</span></span>
                </a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-3">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('presenter.index') }}">
                                <i class="bi bi-house-door me-1"></i> Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="{{ url_for('presenter.about') }}">
                                <i class="bi bi-info-circle me-1"></i> About
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/health' %}active{% endif %}" href="{{ url_for('presenter.health') }}" target="_blank">
                                <i class="bi bi-activity me-1"></i> Health Status
                            </a>
                        </li>
                        <li class="nav-item ms-lg-2">
                            <a href="{{ url_for('presenter.index') }}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                                <i class="bi bi-lightning-charge-fill me-1"></i> Verify News
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Container -->
    <footer class="mt-auto py-4">
        <div class="container text-center text-md-start">
            <div class="row align-items-center">
                <div class="col-md-6 mb-3 mb-md-0">
                    <p class="mb-0 fw-semibold text-dark">
                        <i class="bi bi-shield-lock-fill text-primary me-1"></i> Fake News Detection System
                    </p>
                    <small class="text-muted">Powered by Python, Flask, and Machine Learning (scikit-learn)</small>
                </div>
                <div class="col-md-6 text-md-end">
                    <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2">
                        <i class="bi bi-check-circle-fill me-1"></i> System Operational
                    </span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application Interactivity Script -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
